<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Sabedoria do Carioca</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cinzel', Georgia, serif;
            background-color: #000;
            color: white;
            overflow-x: hidden;
        }

        /* HERO / CAPA */
        .hero {
            min-height: 100vh;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            padding: 30px 40px 40px;
            position: relative;
        }

        /* MENU SUPERIOR */
        .hero-nav {
            width: 100%;
            display: flex;
            gap: 50px;
            justify-content: center;
            font-size: 0.75rem;
            letter-spacing: 3px;
            padding-top: 10px;
        }

        .hero-nav a {
            text-decoration: none;
            color: #999;
            transition: 0.3s;
            font-weight: 300;
        }

        .hero-nav a:hover {
            color: white;
        }

        /* CONTEÚDO PRINCIPAL */
        .hero-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            max-width: 900px;
            padding: 40px 20px;
        }

        .hero-content h1 {
            font-size: 4.5rem;
            color: #b02a2a;
            margin-bottom: 30px;
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .divider-top {
            width: 600px;
            max-width: 90%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b02a2a, transparent);
            margin: 30px auto 40px;
        }

        .hero-content h2 {
            font-size: 1.8rem;
            color: #fff;
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }

        .divider-bottom {
            width: 600px;
            max-width: 90%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #b02a2a, transparent);
            margin: 40px auto 50px;
        }

        /* IMAGEM */
        .hero-image {
            margin: 30px 0;
        }

        .hero-image img {
            max-width: 380px;
            width: 100%;
            height: auto;
            border-radius: 2px;
            box-shadow: 0 0 80px rgba(176, 42, 42, 0.4);
            filter: grayscale(20%) contrast(1.1);
        }

        /* TEXTO FINAL */
        .hero-tagline {
            font-size: 1.4rem;
            color: #ddd;
            margin-top: 30px;
            font-weight: 300;
            letter-spacing: 1px;
            max-width: 700px;
            line-height: 1.6;
        }

        /* RODAPÉ */
        .hero-footer {
            font-size: 0.75rem;
            color: #555;
            letter-spacing: 1px;
            padding-bottom: 10px;
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            .hero-content h1 {
                font-size: 2.8rem;
            }

            .hero-content h2 {
                font-size: 1.3rem;
            }

            .hero-nav {
                gap: 25px;
                font-size: 0.65rem;
            }

            .hero-image img {
                max-width: 280px;
            }

            .hero-tagline {
                font-size: 1.1rem;
            }

            .divider-top,
            .divider-bottom {
                width: 90%;
            }
        }
    </style>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

<div class="hero">

    <!-- MENU -->
    <nav class="hero-nav">
        <a href="sumario.html">SUMÁRIO</a>
        <a href="introducao.html">INTRODUÇÃO</a>
    </nav>

    <!-- CONTEÚDO -->
    <div class="hero-content">
        <h1>Domine a Arte<br>do Micro</h1>
        
        <div class="divider-top"></div>
        
        <h2>E Eleve Sua Genética</h2>
        
        <div class="divider-bottom"></div>

        <!-- IMAGEM DO COVER -->
        <div class="hero-image">
            <img src="carioca.jpg" alt="Cover do Livro">
        </div>

        <p class="hero-tagline">
            Domine o micro.<br>
            Se torne um melhor jogador.
        </p>
    </div>

    <!-- RODAPÉ -->
    <div class="hero-footer">
        © 2026 — Carioca / Projeto de Last Stand
    </div>

</div>

</body>
</html>
